<!DOCTYPE html>
<html>
<head>
  <title>claude ai chat</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 10px;
      margin-bottom: 10px;
    }

    input {
      width: 80%;
      padding: 10px;
      background: #222;
      color: white;
      border: none;
    }

    button {
      padding: 10px;
      background: #5865f2;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>claude ai chat</h1>

<div id="chat"></div>

<input id="msg" placeholder="say something">
<button onclick="send()">send</button>

<script src="https://js.puter.com/v2/"></script>

<script>
async function send() {
    const input = document.getElementById("msg");
    const chat = document.getElementById("chat");

    const text = input.value;

    if (!text) return;

    chat.innerHTML += `<p><b>you:</b> ${text}</p>`;

    input.value = "";

    try {
        const response = await puter.ai.chat(text, {
            model: "claude-opus-4-7"
        });

        chat.innerHTML += `<p><b>claude:</b> ${response}</p>`;
    } catch (err) {
        chat.innerHTML += `<p style="color:red;">error: ${err.message}</p>`;
    }

    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
